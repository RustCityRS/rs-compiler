name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name to use for the release (e.g. v0.1.0-test)'
        required: true
        default: 'v0.0.0-beta'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset: runec-linux-x86_64.tar.gz
            use-cross: false
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            asset: runec-linux-aarch64.tar.gz
            use-cross: true
          # macOS
          - target: x86_64-apple-darwin
            os: macos-latest
            asset: runec-macos-x86_64.tar.gz
            use-cross: false
          - target: aarch64-apple-darwin
            os: macos-latest
            asset: runec-macos-aarch64.tar.gz
            use-cross: false
          # Windows
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset: runec-windows-x86_64.zip
            use-cross: false
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            asset: runec-windows-aarch64.zip
            use-cross: false
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Install cross
        if: matrix.use-cross
        run: cargo install cross --locked

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.use-cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          staging=$(mktemp -d)
          cp target/${{ matrix.target }}/release/runec "$staging/"
          tar -czf ${{ matrix.asset }} -C "$staging" runec

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $staging = New-Item -ItemType Directory -Path (Join-Path $env:RUNNER_TEMP "pkg")
          Copy-Item "target\${{ matrix.target }}\release\runec.exe" $staging
          Compress-Archive -Path "$staging\*" -DestinationPath "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate SHA256 checksums
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS

      - name: Build changelog
        id: changelog
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          PREV=$(git tag --sort=-v:refname | grep -A1 "^${TAG}$" | tail -1)
          if [ "$PREV" = "$TAG" ] || [ -z "$PREV" ]; then
            RANGE="$TAG"
          else
            RANGE="${PREV}..${TAG}"
          fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo "## What's Changed"
            echo ""
            git log "$RANGE" --pretty=format:"- %s" --no-merges
            echo ""
            echo ""
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV}...${TAG}"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          files: artifacts/*
          fail_on_unmatched_files: true

  publish-crate:
    name: Publish to crates.io
    # Real version tags only — skips the workflow_dispatch test-release path,
    # so manual dispatches never push to crates.io.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Refuse to publish if the tag doesn't match the manifest version.
      - name: Verify tag matches Cargo.toml version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          CRATE="$(grep -m1 '^version' Cargo.toml | sed -E 's/.*"(.*)".*/\1/' | tr -d '[:space:]')"
          echo "tag=$TAG  Cargo.toml=$CRATE"
          if [ "$TAG" != "$CRATE" ]; then
            echo "::error::Tag v$TAG does not match Cargo.toml version $CRATE -- bump the version to match the tag before releasing."
            exit 1
          fi

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: publish-crate

      # `cargo publish` builds + verifies the crate, then uploads. It fails if
      # this version already exists on crates.io — bump the version before
      # tagging. Reads the token from CARGO_REGISTRY_TOKEN automatically.
      - name: Publish rs-runec to crates.io
        run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
