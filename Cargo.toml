[package]
name = "rs-runec"
version = "0.5.18"
edition = "2024"
rust-version = "1.95.0"
authors = ["Tyler Telis <xlitersps@gmail.com>", "RustCityRS <https://github.com/RustCityRS>"]
description = "Compiler, linter, and language server for RuneScript, ClientScript, and GlobalScript, with ClientScript decompilation"
license = "MIT"
repository = "https://github.com/RustCityRS/rs-compiler"
homepage = "https://github.com/RustCityRS/rs-compiler"
readme = "README.md"
include = ["src/**/*", "LICENSE.md", "LICENSE.neptune", "README.md"]

[lib]
name = "runec"

[[bin]]
name = "runec"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde_json = "1"
clap = { version = "4.6", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# Heap profiling via a counting global allocator (src/memprof.rs). Off by
# default so the shipped binary is unaffected; enable with `--features memprof`
# to log per-phase live heap and the global peak. Adds no dependencies.
memprof = []

# Release profile tuned for runtime speed. These only affect how the optimizer
# compiles identical source — no behavior change. Fat LTO + a single codegen
# unit let the optimizer inline across module boundaries (lexer/parser/registry
# hot paths) at the cost of a slower build.
[profile.release]
lto = "fat"
codegen-units = 1
